server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: genie
  datasource:
    url: ${DATABASE_JDBC_URL:jdbc:postgresql://localhost:5433/genie}
    username: ${DATABASE_USERNAME:genie}
    password: ${DATABASE_PASSWORD:genie}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
  flyway:
    locations: classpath:db/migration
    url: ${DATABASE_JDBC_URL_DIRECT:${spring.datasource.url}}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    default-property-inclusion: non_null
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
    mapper:
      allow-coercion-of-scalars: false

genie:
  version: ${APP_VERSION:${RENDER_GIT_COMMIT:@project.version@}}
  timezone: Africa/Lagos
  security:
    jwt-secret: ${JWT_SECRET:}
    token-lifetime: 8h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  level:
    root: INFO
    ng.tesa.genie: INFO
  pattern:
    # Every log line shows the request ID (set by RequestIdFilter), so one journey can be followed.
    level: "%5p [%X{requestId:-}]"

---
spring:
  config:
    activate:
      on-profile: local
genie:
  security:
    jwt-secret: ${JWT_SECRET:genie-local-development-secret-key-at-least-32-bytes}
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

---
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/seed

---
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    enabled: ${FLYWAY_ON_STARTUP:false}
server:
  error:
    include-stacktrace: never
    include-message: never
logging:
  structured:
    format:
      # Structured JSON logs on the hosts. ECS adds every MDC value, so each line has "requestId".
      console: ecs
